services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qn_calendar}
      POSTGRES_USER: ${POSTGRES_USER:-qn_calendar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qn_calendar}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-qn_calendar}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-qn_calendar}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-qn_calendar}
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres-data:
