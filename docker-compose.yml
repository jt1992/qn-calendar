services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_DESKTOP_ENABLED: "false"
      QN_CALENDAR_DATA_DIR: /data
      SERVER_PORT: ${SERVER_PORT:-8080}
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    volumes:
      - qn-calendar-data:/data

volumes:
  qn-calendar-data:
