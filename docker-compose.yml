services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qn_calendar
      POSTGRES_USER: qn_calendar
      POSTGRES_PASSWORD: qn_calendar
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/qn_calendar
      SPRING_DATASOURCE_USERNAME: qn_calendar
      SPRING_DATASOURCE_PASSWORD: qn_calendar
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mailhog

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
