server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: qn-calendar-backend
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/qn-calendar;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: "${SPRING_DATASOURCE_PASSWORD:}"
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      "[hibernate.format_sql]": true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: "${SMTP_USER:}"
    password: "${SMTP_PASSWORD:}"
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${SMTP_USE_TLS:false}
      "[mail.smtp.ssl.enable]": ${SMTP_USE_SSL:false}
      "[mail.smtp.from]": "${SMTP_FROM:}"
