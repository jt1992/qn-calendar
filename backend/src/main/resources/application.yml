server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: jdbc:sqlite:${qn.calendar.data-dir}/qn-calendar.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update

app:
  time-zone: ${APP_TIME_ZONE:Asia/Shanghai}
  desktop:
    enabled: ${APP_DESKTOP_ENABLED:false}
    open-browser-on-startup: ${APP_DESKTOP_OPEN_BROWSER:true}
