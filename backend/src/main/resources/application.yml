server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: qn-calendar-backend
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:${qn.calendar.data-dir}/qn-calendar.db}
    driver-class-name: org.sqlite.JDBC
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: "${SPRING_DATASOURCE_PASSWORD:}"
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      "[hibernate.format_sql]": true

app:
  desktop:
    enabled: ${APP_DESKTOP_ENABLED:false}
    open-browser-on-startup: ${APP_DESKTOP_OPEN_BROWSER:true}
