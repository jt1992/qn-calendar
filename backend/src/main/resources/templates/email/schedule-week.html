<!DOCTYPE html>
<html lang="zh-Hans" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title th:text="${subject}">工单排程表</title>
    <style>
      @page {
        size: A4 landscape;
        margin: 8mm;
      }

      @media print {
        html,
        body {
          height: auto !important;
          min-height: 0 !important;
          overflow: visible !important;
        }

        body {
          background: #ffffff !important;
          margin: 0 !important;
          padding: 0 !important;
        }

        .schedule-section {
          break-after: auto !important;
          page-break-after: auto !important;
        }

        .schedule-section.page-break {
          break-before: page;
          page-break-before: always;
        }

        .calendar-cell {
          padding: 3px !important;
        }

        .calendar-card {
          margin-bottom: 3px !important;
          padding: 4px 5px !important;
        }

        .week-time-card {
          padding: 4px 5px !important;
        }

        .weekly-remark {
          overflow: visible !important;
        }
      }
    </style>
  </head>
  <body style="margin:0;padding:10px;background:#ffffff;color:#17212b;font-family:Arial,'Noto Sans SC','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.22;">
    <p
      th:unless="${document.weekView}"
      style="margin:0 0 8px;color:#4f5d6b;font-size:18px;font-weight:800;line-height:1.15;"
      th:text="${document.viewLabel + ' ｜ ' + document.rangeLabel}"
    >
      月表 ｜ 2026-04
    </p>

    <section
      th:each="section : ${document.sections}"
      th:class="${section.pageBreakBefore ? 'schedule-section page-break' : 'schedule-section'}"
      style="margin-top:0;"
    >
      <table
        th:if="${document.weekView}"
        cellpadding="0"
        cellspacing="0"
        class="week-timegrid"
        style="width:100%;border-collapse:collapse;table-layout:fixed;border:1px solid #cfd8e3;"
      >
        <thead>
          <tr>
            <th style="width:48px;padding:5px 4px;border:1px solid #cfd8e3;background:#f7f9fb;color:#4f5d6b;font-size:11px;font-weight:800;line-height:1.1;">
              时间
            </th>
            <th
              th:each="day : ${section.days}"
              style="padding:5px 4px;border:1px solid #cfd8e3;background:#f7f9fb;color:#4f5d6b;font-size:12px;font-weight:900;line-height:1.1;text-align:left;"
              th:text="${day.label}"
            >
              2026-06-08 一
            </th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td style="width:48px;padding:0;border:1px solid #cfd8e3;background:#fbfcfd;vertical-align:top;">
              <div
                class="time-axis"
                th:style="${section.timeGridHeightStyle + 'position:relative;'}"
              >
                <div
                  th:each="tick : ${section.timeTicks}"
                  th:style="${tick.offsetStyle + 'position:absolute;left:4px;right:2px;margin-top:-7px;color:#687584;font-size:11px;font-weight:800;line-height:1;'}"
                  th:text="${tick.label}"
                >
                  09:00
                </div>
              </div>
            </td>
            <td
              th:each="day : ${section.days}"
              style="padding:0;border:1px solid #cfd8e3;background:#ffffff;vertical-align:top;"
            >
              <div
                class="week-day-grid"
                th:style="${section.timeGridHeightStyle + 'position:relative;'}"
              >
                <div
                  th:each="tick : ${section.timeTicks}"
                  th:style="${tick.offsetStyle + 'position:absolute;left:0;right:0;border-top:1px solid #d8e0ea;height:0;'}"
                ></div>
                <div
                  th:each="row : ${day.rows}"
                  class="week-time-card"
                  th:style="${row.timeGridStyle + (row.done
                    ? 'border-left:3px solid #9aa6b2;border-radius:4px;background:#f1f3f5;color:#687584;overflow:visible;'
                    : 'border-left:3px solid #2563eb;border-radius:4px;background:#e8f2ff;color:#17212b;overflow:visible;')}"
                >
                  <div style="font-size:10px;font-weight:900;line-height:1.06;word-break:break-all;">
                    <span th:if="${row.urgent}" style="color:#d21f1f;font-size:11px;">[加急] </span>
                    <span th:text="${row.orderNo}">A001</span>
                  </div>
                  <div style="margin-top:2px;font-size:11px;font-weight:800;line-height:1.08;color:#165f9f;" th:text="${row.startTime + ' ~ ' + row.endTime}">
                    09:00 ~ 11:00
                  </div>
                  <div style="margin-top:2px;color:#d21f1f;font-size:11px;font-weight:900;line-height:1.08;">
                    <span style="display:block;">最晚发货：</span>
                    <span style="display:block;white-space:nowrap;" th:text="${row.shipDateText}">2026-06-08</span>
                    <span style="display:block;white-space:nowrap;" th:text="${row.shipTimeText}">23:59:59</span>
                  </div>
                  <div
                    class="weekly-remark"
                    style="margin-top:4px;font-size:11px;line-height:1.12;white-space:pre-line;word-break:break-word;overflow:visible;"
                    th:text="${row.remark}"
                  >
                    买家留言：备注
                  </div>
                </div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>

      <table
        th:unless="${document.weekView}"
        cellpadding="0"
        cellspacing="0"
        style="width:100%;border-collapse:collapse;table-layout:fixed;border:1px solid #cfd8e3;"
      >
        <tbody>
          <tr th:each="week : ${section.weeks}">
            <td
              th:each="day : ${week.days}"
              class="calendar-cell"
              style="padding:4px;border:1px solid #cfd8e3;vertical-align:top;background:#ffffff;"
            >
              <div style="margin:0 0 3px;color:#4f5d6b;font-size:12px;font-weight:800;line-height:1.15;" th:text="${day.label}">
                2026-06-08 一
              </div>
              <div th:if="${#lists.isEmpty(day.rows)}" style="min-height:10px;color:#9aa6b2;font-size:11px;">
                &#160;
              </div>
              <div
                th:each="row : ${day.rows}"
                class="calendar-card"
                th:style="${row.done}
                  ? 'margin:0 0 4px;padding:4px 5px;border-left:3px solid #9aa6b2;border-radius:4px;background:#f1f3f5;color:#687584;'
                  : 'margin:0 0 4px;padding:4px 5px;border-left:3px solid #2563eb;border-radius:4px;background:#e8f2ff;color:#17212b;'"
              >
                <div style="font-size:11px;font-weight:900;line-height:1.12;word-break:break-all;">
                  <span th:if="${row.urgent}" style="color:#d21f1f;font-size:12px;">[加急] </span>
                  <span th:text="${row.orderNo}">A001</span>
                </div>
                <div style="margin-top:2px;font-size:12px;font-weight:800;line-height:1.12;color:#165f9f;" th:text="${row.startTime + ' ~ ' + row.endTime}">
                  09:00 ~ 11:00
                </div>
                <div style="margin-top:2px;color:#d21f1f;font-size:12px;font-weight:900;line-height:1.14;">
                  <span style="display:block;">最晚发货：</span>
                  <span style="display:block;white-space:nowrap;" th:text="${row.shipDateText}">2026-06-08</span>
                  <span style="display:block;white-space:nowrap;" th:text="${row.shipTimeText}">23:59:59</span>
                </div>
                <div
                  th:if="${document.weekView}"
                  class="weekly-remark"
                  style="margin-top:3px;font-size:11px;line-height:1.12;white-space:pre-line;word-break:break-word;overflow:visible;"
                >
                  <span style="display:block;font-weight:800;">备注：</span>
                  <span style="display:block;" th:text="${row.remark}">买家留言：备注</span>
                </div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <p
        th:if="${section.noMoreRowsMessage != null}"
        style="margin:8px 0 0;color:#4f5d6b;font-size:14px;font-weight:800;"
        th:text="${section.noMoreRowsMessage}"
      >
        2026-06-06 之后暂时没有排工单
      </p>
    </section>
  </body>
</html>
