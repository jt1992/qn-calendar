<!doctype html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title th:text="${subject}">工單排程表</title>
    <style>
      @media print {
        body {
          background: #ffffff !important;
          padding: 0 !important;
        }

        .schedule-section.page-break {
          break-before: page;
          page-break-before: always;
        }

        .day-block {
          break-inside: avoid;
          page-break-inside: avoid;
        }

        tr {
          break-inside: avoid;
          page-break-inside: avoid;
        }
      }
    </style>
  </head>
  <body style="margin:0;padding:18px;background:#ffffff;color:#17212b;font-family:Arial,'Noto Sans TC',sans-serif;font-size:18px;line-height:1.35;">
    <h1 style="margin:0 0 6px;font-size:28px;line-height:1.2;" th:text="${subject}">工單排程表</h1>
    <p style="margin:0 0 18px;color:#4f5d6b;font-size:18px;">
      <span th:text="${document.viewLabel}">週排程表</span>
      <span>｜</span>
      <span th:text="${document.rangeLabel}">2026-06-08 - 2026-06-14</span>
    </p>

    <section
      th:each="section : ${document.sections}"
      th:class="${section.pageBreakBefore ? 'schedule-section page-break' : 'schedule-section'}"
      style="margin-top:28px;"
    >
      <h2 style="margin:0 0 12px;padding:8px 10px;background:#edf1f5;border-left:6px solid #2563eb;font-size:24px;line-height:1.2;" th:text="${section.title}">
        2026-06-08 - 2026-06-14
      </h2>

      <div th:if="${#lists.isEmpty(section.days)}" style="padding:16px;border:1px solid #cfd8e3;color:#607080;text-align:center;">
        此日期區間沒有已排程工單
      </div>

      <div th:each="day : ${section.days}" class="day-block" style="margin:0 0 18px;">
        <h3 style="margin:0 0 6px;color:#17212b;font-size:22px;line-height:1.25;" th:text="${day.label}">
          2026-06-08 一
        </h3>

        <table cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;table-layout:auto;border:1px solid #cfd8e3;">
          <colgroup th:if="${document.weekView}">
            <col style="width:18%;" />
            <col style="width:12%;" />
            <col style="width:12%;" />
            <col style="width:13%;" />
            <col style="width:17%;" />
            <col />
          </colgroup>
          <colgroup th:unless="${document.weekView}">
            <col style="width:40%;" />
            <col style="width:20%;" />
            <col style="width:20%;" />
            <col style="width:20%;" />
          </colgroup>
          <thead>
            <tr>
              <th style="padding:7px 8px;border:1px solid #cfd8e3;background:#f3f6f8;text-align:left;font-size:18px;">訂單編號</th>
              <th style="padding:7px 8px;border:1px solid #cfd8e3;background:#f3f6f8;text-align:left;font-size:18px;">開始時間</th>
              <th style="padding:7px 8px;border:1px solid #cfd8e3;background:#f3f6f8;text-align:left;font-size:18px;">結束時間</th>
              <th style="padding:7px 8px;border:1px solid #cfd8e3;background:#f3f6f8;text-align:left;font-size:18px;">工時</th>
              <th th:if="${document.weekView}" style="padding:7px 8px;border:1px solid #cfd8e3;background:#f3f6f8;text-align:left;font-size:18px;">發貨日期</th>
              <th th:if="${document.weekView}" style="padding:7px 8px;border:1px solid #cfd8e3;background:#f3f6f8;text-align:left;font-size:18px;">備注</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="row : ${day.rows}" th:style="${row.done} ? 'background:#f1f3f5;color:#687584;' : 'background:#ffffff;color:#17212b;'">
              <td style="padding:6px 8px;border:1px solid #d7e0ea;font-size:18px;font-weight:800;vertical-align:top;">
                <span th:if="${row.urgent}" style="color:#d21f1f;">[加急] </span>
                <span th:text="${row.orderNo}">A001</span>
              </td>
              <td style="padding:6px 8px;border:1px solid #d7e0ea;font-size:18px;vertical-align:top;" th:text="${row.startTime}">09:00</td>
              <td style="padding:6px 8px;border:1px solid #d7e0ea;font-size:18px;vertical-align:top;" th:text="${row.endTime}">11:00</td>
              <td style="padding:6px 8px;border:1px solid #d7e0ea;font-size:18px;vertical-align:top;" th:text="${row.durationText}">2小時</td>
              <td
                th:if="${document.weekView}"
                style="padding:6px 8px;border:1px solid #d7e0ea;color:#d21f1f;font-size:19px;font-weight:900;vertical-align:top;white-space:nowrap;"
                th:text="${row.shipDate}"
              >
                2026-06-08
              </td>
              <td
                th:if="${document.weekView}"
                style="padding:6px 8px;border:1px solid #d7e0ea;font-size:20px;line-height:1.3;vertical-align:top;white-space:pre-line;"
                th:text="${row.remark}"
              >
                備注
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </body>
</html>
