<!doctype html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title th:text="${subject}">工单排程表</title>
    <style>
      @media print {
        body {
          background: #ffffff !important;
          padding: 0 !important;
        }

        .schedule-section.page-break {
          break-before: page;
          page-break-before: always;
        }

        .calendar-cell,
        .calendar-card {
          break-inside: avoid;
          page-break-inside: avoid;
        }
      }
    </style>
  </head>
  <body style="margin:0;padding:18px;background:#ffffff;color:#17212b;font-family:Arial,'Noto Sans TC',sans-serif;font-size:18px;line-height:1.35;">
    <h1 style="margin:0 0 6px;font-size:28px;line-height:1.2;" th:text="${subject}">工单排程表</h1>
    <p style="margin:0 0 18px;color:#4f5d6b;font-size:18px;">
      <span th:text="${document.viewLabel}">周排程表</span>
      <span>｜</span>
      <span th:text="${document.rangeLabel}">2026-06-08 - 2026-06-14</span>
    </p>

    <section
      th:each="section : ${document.sections}"
      th:class="${section.pageBreakBefore ? 'schedule-section page-break' : 'schedule-section'}"
      style="margin-top:24px;"
    >
      <h2 style="margin:0 0 10px;padding:8px 10px;background:#edf1f5;border-left:6px solid #2563eb;font-size:24px;line-height:1.2;" th:text="${section.title}">
        2026-06-08 - 2026-06-14
      </h2>

      <table cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;table-layout:fixed;border:1px solid #cfd8e3;">
        <tbody>
          <tr th:each="week : ${section.weeks}">
            <td
              th:each="day : ${week.days}"
              class="calendar-cell"
              style="height:122px;padding:6px;border:1px solid #cfd8e3;vertical-align:top;background:#ffffff;"
            >
              <div style="margin:0 0 5px;color:#4f5d6b;font-size:16px;font-weight:800;line-height:1.2;" th:text="${day.label}">
                2026-06-08 一
              </div>
              <div th:if="${#lists.isEmpty(day.rows)}" style="min-height:18px;color:#9aa6b2;font-size:15px;">
                &nbsp;
              </div>
              <div
                th:each="row : ${day.rows}"
                class="calendar-card"
                th:style="${row.done}
                  ? 'margin:0 0 6px;padding:6px 7px;border-left:4px solid #9aa6b2;border-radius:6px;background:#f1f3f5;color:#687584;'
                  : 'margin:0 0 6px;padding:6px 7px;border-left:4px solid #2563eb;border-radius:6px;background:#e8f2ff;color:#17212b;'"
              >
                <div style="font-size:17px;font-weight:900;line-height:1.2;word-break:break-all;">
                  <span th:if="${row.urgent}" style="color:#d21f1f;">[加急] </span>
                  <span th:text="${row.orderNo}">A001</span>
                </div>
                <div style="margin-top:3px;font-size:16px;font-weight:800;line-height:1.2;color:#165f9f;" th:text="${row.startTime + ' ~ ' + row.endTime}">
                  09:00 ~ 11:00
                </div>
                <div style="margin-top:3px;color:#d21f1f;font-size:16px;font-weight:900;line-height:1.25;">
                  最晚发货：<span th:text="${row.shipDate}">2026-06-08 23:59:59</span>
                </div>
                <div
                  th:if="${document.weekView}"
                  style="margin-top:4px;font-size:16px;line-height:1.3;white-space:pre-line;word-break:break-word;"
                >
                  备注：<span th:text="${row.remark}">备注</span>
                </div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </body>
</html>
