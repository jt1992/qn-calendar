<!doctype html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title th:text="${subject}">完工统计表</title>
    <style>
      @media print {
        body {
          background: #ffffff !important;
          padding: 0 !important;
        }

        tr {
          break-inside: avoid;
          page-break-inside: avoid;
        }
      }
    </style>
  </head>
  <body style="margin:0;padding:18px;background:#ffffff;color:#17212b;font-family:Arial,'Noto Sans TC',sans-serif;font-size:18px;line-height:1.35;">
    <h1 style="margin:0 0 6px;font-size:28px;line-height:1.2;" th:text="${subject}">完工统计表</h1>
    <p style="margin:0 0 18px;color:#4f5d6b;font-size:18px;">
      完工统计表｜<span th:text="${document.monthLabel}">2026-06</span>｜<span th:text="${#lists.size(document.rows)}">0</span> 笔
    </p>

    <table cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;table-layout:auto;border:1px solid #cfd8e3;">
      <colgroup>
        <col style="width:13%;" />
        <col />
        <col style="width:11%;" />
        <col style="width:12%;" />
        <col style="width:12%;" />
        <col style="width:12%;" />
        <col style="width:12%;" />
      </colgroup>
      <thead>
        <tr>
          <th style="padding:7px 8px;border:1px solid #cfd8e3;background:#f3f6f8;text-align:left;font-size:18px;">订单编号</th>
          <th style="padding:7px 8px;border:1px solid #cfd8e3;background:#f3f6f8;text-align:left;font-size:18px;">订单备注</th>
          <th style="padding:7px 8px;border:1px solid #cfd8e3;background:#f3f6f8;text-align:left;font-size:18px;">订单价格</th>
          <th style="padding:7px 8px;border:1px solid #cfd8e3;background:#f3f6f8;text-align:left;font-size:18px;">原本预估时长</th>
          <th style="padding:7px 8px;border:1px solid #cfd8e3;background:#f3f6f8;text-align:left;font-size:18px;">实际总时长</th>
          <th style="padding:7px 8px;border:1px solid #cfd8e3;background:#f3f6f8;text-align:left;font-size:18px;">差异时间</th>
          <th style="padding:7px 8px;border:1px solid #cfd8e3;background:#f3f6f8;text-align:left;font-size:18px;">时薪</th>
        </tr>
      </thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(document.rows)}">
          <td colspan="7" style="padding:16px;border:1px solid #d7e0ea;color:#607080;text-align:center;font-size:18px;">
            尚无已完成工单
          </td>
        </tr>
        <tr th:each="row : ${document.rows}">
          <td style="padding:6px 8px;border:1px solid #d7e0ea;font-size:18px;font-weight:800;vertical-align:top;" th:text="${row.orderNo}">A001</td>
          <td style="padding:6px 8px;border:1px solid #d7e0ea;font-size:18px;line-height:1.3;vertical-align:top;white-space:pre-line;" th:text="${row.remark}">备注</td>
          <td style="padding:6px 8px;border:1px solid #d7e0ea;font-size:18px;vertical-align:top;white-space:nowrap;" th:text="${row.price}">$300</td>
          <td style="padding:6px 8px;border:1px solid #d7e0ea;font-size:18px;vertical-align:top;white-space:nowrap;" th:text="${row.estimatedDuration}">3小时0分钟</td>
          <td style="padding:6px 8px;border:1px solid #d7e0ea;font-size:18px;vertical-align:top;white-space:nowrap;" th:text="${row.actualDuration}">2小时30分钟</td>
          <td style="padding:6px 8px;border:1px solid #d7e0ea;font-size:18px;vertical-align:top;white-space:nowrap;">
            <span
              th:style="${row.deltaTone == 'late'}
                ? 'display:inline-block;padding:2px 8px;border-radius:999px;background:#fff0ee;color:#d21f1f;font-weight:800;'
                : (${row.deltaTone == 'early'} ? 'display:inline-block;padding:2px 8px;border-radius:999px;background:#eff6ff;color:#2563eb;font-weight:800;' : 'display:inline-block;padding:2px 8px;border-radius:999px;background:#f3f6f8;color:#4f5d6b;font-weight:800;')"
              th:text="${row.deltaText}"
            >
              符合预期
            </span>
          </td>
          <td style="padding:6px 8px;border:1px solid #d7e0ea;font-size:18px;vertical-align:top;white-space:nowrap;" th:text="${row.hourlyRate}">$120 / 小时</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
