<!DOCTYPE html>
<html lang="zh-Hans" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title th:text="${subject}">完工统计表</title>
    <style>
      @page {
        size: A4 landscape;
        margin: 8mm;
      }

      @media print {
        html,
        body {
          height: auto !important;
          min-height: 0 !important;
          overflow: visible !important;
        }

        body {
          background: #ffffff !important;
          margin: 0 !important;
          padding: 0 !important;
        }

        tr {
          break-inside: avoid;
          page-break-inside: avoid;
        }
      }
    </style>
  </head>
  <body style="width:100%;max-width:none;margin:0;padding:10px;background:#ffffff;color:#17212b;font-family:Arial,'Noto Sans SC','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.24;">
    <p
      style="margin:0 0 8px;color:#4f5d6b;font-size:18px;font-weight:800;line-height:1.15;"
      th:text="${'完工统计表｜' + document.monthLabel + '｜' + #lists.size(document.rows) + ' 笔'}"
    >
      完工统计表｜全部｜5 笔
    </p>

    <table cellpadding="0" cellspacing="0" width="100%" style="width:100%;max-width:none;border-collapse:collapse;table-layout:fixed;border:1px solid #cfd8e3;">
      <colgroup>
        <col style="width:16%;" />
        <col style="width:34%;" />
        <col style="width:7%;" />
        <col style="width:8%;" />
        <col style="width:9%;" />
        <col style="width:7%;" />
        <col style="width:11%;" />
        <col style="width:8%;" />
      </colgroup>
      <thead>
        <tr>
          <th style="padding:5px 6px;border:1px solid #cfd8e3;background:#f3f6f8;text-align:left;font-size:14px;">订单编号</th>
          <th style="padding:5px 6px;border:1px solid #cfd8e3;background:#f3f6f8;text-align:left;font-size:14px;">订单备注</th>
          <th style="padding:5px 6px;border:1px solid #cfd8e3;background:#f3f6f8;text-align:right;font-size:14px;">订单价格</th>
          <th style="padding:5px 6px;border:1px solid #cfd8e3;background:#f3f6f8;text-align:right;font-size:14px;">预估工时</th>
          <th style="padding:5px 6px;border:1px solid #cfd8e3;background:#f3f6f8;text-align:right;font-size:14px;">实际工时</th>
          <th style="padding:5px 6px;border:1px solid #cfd8e3;background:#f3f6f8;text-align:right;font-size:14px;">暂停时长</th>
          <th style="padding:5px 6px;border:1px solid #cfd8e3;background:#f3f6f8;text-align:right;font-size:14px;">工时差</th>
          <th style="padding:5px 6px;border:1px solid #cfd8e3;background:#f3f6f8;text-align:right;font-size:14px;">时薪</th>
        </tr>
      </thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(document.rows)}">
          <td colspan="8" style="padding:14px;border:1px solid #d7e0ea;color:#607080;text-align:center;font-size:16px;">
            尚无已完成工单
          </td>
        </tr>
        <tr th:each="row : ${document.rows}">
          <td style="padding:4px 6px;border:1px solid #d7e0ea;font-size:14px;font-weight:800;vertical-align:top;word-break:break-all;" th:text="${row.orderNo}">A001</td>
          <td style="padding:4px 6px;border:1px solid #d7e0ea;font-size:13px;line-height:1.22;vertical-align:top;white-space:pre-line;word-break:break-word;" th:text="${row.remark}">备注</td>
          <td style="padding:4px 6px;border:1px solid #d7e0ea;font-size:14px;vertical-align:top;text-align:right;white-space:nowrap;" th:text="${row.price}">¥300</td>
          <td style="padding:4px 6px;border:1px solid #d7e0ea;font-size:14px;vertical-align:top;text-align:right;white-space:nowrap;" th:text="${row.estimatedDuration}">3 h</td>
          <td style="padding:4px 6px;border:1px solid #d7e0ea;font-size:14px;vertical-align:top;text-align:right;white-space:nowrap;" th:text="${row.actualDuration}">2 h 30 m</td>
          <td style="padding:4px 6px;border:1px solid #d7e0ea;font-size:14px;vertical-align:top;text-align:right;white-space:nowrap;" th:text="${row.pausedDuration}">30 m</td>
          <td style="padding:4px 6px;border:1px solid #d7e0ea;font-size:14px;vertical-align:top;text-align:right;white-space:nowrap;">
            <span
              th:style="${row.deltaTone == 'late'}
                ? 'display:inline-block;padding:2px 5px;border-radius:999px;background:#fff0ee;color:#d21f1f;font-weight:800;line-height:1.05;letter-spacing:0;'
                : (${row.deltaTone == 'early'} ? 'display:inline-block;padding:2px 5px;border-radius:999px;background:#eff6ff;color:#2563eb;font-weight:800;line-height:1.05;letter-spacing:0;' : 'display:inline-block;padding:2px 5px;border-radius:999px;background:#f3f6f8;color:#4f5d6b;font-weight:800;line-height:1.05;letter-spacing:0;')"
              th:text="${row.deltaText}"
            >
              符合预期
            </span>
          </td>
          <td style="padding:4px 6px;border:1px solid #d7e0ea;font-size:14px;vertical-align:top;text-align:right;white-space:nowrap;" th:text="${row.hourlyRate}">¥120.00</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
