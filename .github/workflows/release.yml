name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build executable jar
        run: |
          mvn -B -f backend/pom.xml -DskipTests package
          mkdir -p release-input
          cp backend/target/qn-calendar-backend-*.jar release-input/app.jar

      - uses: actions/upload-artifact@v6
        with:
          name: qn-calendar-jar
          path: release-input/app.jar

  build-windows:
    needs: build-jar
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: qn-calendar-jar
          path: target

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress
          $wixHome = Get-ChildItem "${env:ProgramFiles(x86)}" -Filter "WiX Toolset*" | Select-Object -First 1
          if ($wixHome) {
            Add-Content $env:GITHUB_PATH "$($wixHome.FullName)\bin"
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $releaseVersion = "${{ github.ref_name }}" -replace '^v', ''
          $version = if ($releaseVersion -match '^0(\.|$)') { "1$($releaseVersion.Substring(1))" } else { $releaseVersion }
          mkdir dist
          $env:JAVA_TOOL_OPTIONS = "-Duser.language=zh -Duser.country=CN"
          jpackage `
            --input target `
            --main-jar app.jar `
            --dest dist `
            --name QnCalendar `
            --type exe `
            --app-version $version `
            --vendor "Qn Calendar" `
            --win-dir-chooser `
            --win-shortcut `
            --win-menu `
            --win-upgrade-uuid "2F10A62F-230F-4B84-A7BB-1FEC7386A9A4" `
            --java-options "-Dapp.desktop.enabled=true" `
            --java-options "-Djava.awt.headless=false" `
            --java-options "-Dfile.encoding=UTF-8"

      - uses: actions/upload-artifact@v6
        with:
          name: qn-calendar-windows
          path: dist/*.exe

  build-macos:
    needs: build-jar
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: qn-calendar-jar
          path: target

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build macOS installers
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$RELEASE_VERSION" == 0 || "$RELEASE_VERSION" == 0.* ]]; then
            VERSION="1${RELEASE_VERSION:1}"
          else
            VERSION="$RELEASE_VERSION"
          fi
          mkdir -p dist
          for packageType in dmg pkg; do
            jpackage \
              --input target \
              --main-jar app.jar \
              --dest dist \
              --name QnCalendar \
              --type "$packageType" \
              --app-version "$VERSION" \
              --vendor "Qn Calendar" \
              --mac-package-identifier com.qn.calendar \
              --mac-package-name QnCalendar \
              --java-options "-Dapp.desktop.enabled=true" \
              --java-options "-Djava.awt.headless=false" \
              --java-options "-Dfile.encoding=UTF-8"
          done

      - uses: actions/upload-artifact@v6
        with:
          name: qn-calendar-macos
          path: dist/*

  publish-release:
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: qn-calendar-windows
          path: release-assets

      - uses: actions/download-artifact@v7
        with:
          name: qn-calendar-macos
          path: release-assets

      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
